<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Catálogo · Revendi</title>
    <meta name="description" content="Folheie o catálogo online na Revendi." />
    <meta name="theme-color" content="#f7f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111014" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Prévia do link (Open Graph): o servidor põe aqui (server/app.mjs). -->
    <!-- server:meta -->

    <!-- O PDF vem do S3: já abre a conexão. -->
    <link rel="preconnect" href="https://s3.us-east-1.amazonaws.com" crossorigin />

    <!-- Escuro desde o primeiro quadro, sem piscar o claro. -->
    <script>
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Build: começa API, worker do PDF.js e pré-carga (vite.config.ts, earlyStart). -->
    <!-- catalog-early-start -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
